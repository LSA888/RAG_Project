# ============================================================
# 本地 Milvus 向量数据库（standalone 单机版）
# 用途：RAG 项目的向量存储，替代连不上的远程 47.94.86.115
#
# 启动：在本文件所在目录执行  docker compose up -d
# 停止：docker compose down
# 查看状态：docker compose ps
#
# 启动后 .env 里配置： MILVUS_URL=http://127.0.0.1:19530
# ============================================================
services:
  # etcd：Milvus 的元数据存储（依赖组件，无需手动管理）
  # 使用 bitnami 官方归档镜像（docker hub，国内加速器可拉取；quay.io/coreos/etcd 国内访问困难）
  etcd:
    container_name: milvus-etcd
    image: bitnamilegacy/etcd:3.5
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # minio：对象存储（Milvus 内部存索引文件 + RAG 项目存文档图片，复用同一实例，不同 bucket 互不干扰）
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API 端口（RAG 项目 .env 的 MINIO_ENDPOINT 连接这个）
      - "9001:9001"   # MinIO 管理控制台（浏览器访问 http://127.0.0.1:9001）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # milvus 主服务
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # Milvus gRPC/HTTP 端口（项目连接这个）
      - "9091:9091"     # 健康检查/监控端口
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

# 数据卷：容器删除后数据仍然保留
volumes:
  etcd_data:
  minio_data:
  milvus_data:
