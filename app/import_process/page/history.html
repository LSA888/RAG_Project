<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话历史 - 掌柜智库</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
            height: calc(100vh - 40px);
        }
        .panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid #ecf0f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-header h2 {
            margin: 0;
            font-size: 16px;
            color: #2c3e50;
        }
        .panel-header .count {
            background: #3498db;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .refresh-btn {
            padding: 6px 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-home {
            padding: 6px 12px;
            background: white;
            color: #3498db;
            border: 1px solid #3498db;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 12px;
        }
        .list {
            flex: 1;
            overflow-y: auto;
        }
        .session-item {
            padding: 14px 18px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .session-item:hover { background: #f5f9ff; }
        .session-item.active { background: #eaf4ff; border-left: 3px solid #3498db; }
        .session-item .preview {
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .session-item .meta {
            font-size: 12px;
            color: #95a5a6;
            display: flex;
            gap: 10px;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }

        .detail {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .msg {
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
        }
        .msg.user { justify-content: flex-end; }
        .msg .bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
        }
        .msg.user .bubble {
            background: #3498db;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.bot .bubble {
            background: #f0f4f8;
            color: #2c3e50;
            border-bottom-left-radius: 4px;
        }
        .msg .ts {
            font-size: 11px;
            color: #95a5a6;
            margin-top: 4px;
        }

        .session-toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .delete-btn {
            padding: 4px 10px;
            background: white;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover { background: #fef0f0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧会话列表 -->
        <div class="panel">
            <div class="panel-header">
                <h2>💬 所有会话</h2>
                <span class="count" id="total-count">0</span>
            </div>
            <div class="list" id="session-list">
                <div class="empty">加载中...</div>
            </div>
        </div>

        <!-- 右侧对话详情 -->
        <div class="panel">
            <div class="panel-header">
                <div>
                    <h2 id="detail-title">选择会话查看对话记录</h2>
                    <div style="font-size:12px;color:#95a5a6;margin-top:2px;" id="detail-meta"></div>
                </div>
                <div class="session-toolbar">
                    <a class="btn-home" href="/">🏠 返回首页</a>
                    <button class="refresh-btn" onclick="loadSessions()">🔄</button>
                    <button class="delete-btn" id="delete-btn" style="display:none;" onclick="deleteCurrent()">🗑 删除</button>
                </div>
            </div>
            <div class="detail" id="chat-detail">
                <div class="empty">请从左侧选择一个会话查看详情<br><br>💡 新对话会自动创建会话，刷新即可看到</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8001';
        let currentSessionId = null;

        async function loadSessions() {
            const list = document.getElementById('session-list');
            list.innerHTML = '<div class="empty">加载中...</div>';
            try {
                const res = await fetch(`${API_BASE}/api/all_history`);
                const data = await res.json();
                if (!data.ok) { list.innerHTML = `<div class="empty">❌ 加载失败</div>`; return; }
                renderSessions(data.sessions);
            } catch (e) {
                list.innerHTML = `<div class="empty">❌ 请确认查询服务(8001)已启动<br>${e.message}</div>`;
            }
        }

        function renderSessions(sessions) {
            document.getElementById('total-count').textContent = sessions.length;
            if (!sessions.length) {
                document.getElementById('session-list').innerHTML = '<div class="empty">暂无会话<br>💡 去智能问答页提问后会自动记录</div>';
                return;
            }
            document.getElementById('session-list').innerHTML = sessions.map(s => `
                <div class="session-item" onclick="selectSession('${s.session_id}')">
                    <div class="preview">${escapeHtml(s.preview || '(无用户提问)')}</div>
                    <div class="meta">
                        <span>💬 ${s.message_count} 条</span>
                        <span>🕒 ${formatTs(s.last_ts)}</span>
                    </div>
                </div>
            `).join('');
        }

        function selectSession(sid) {
            currentSessionId = sid;
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.session-item')?.classList.add('active');
            document.getElementById('delete-btn').style.display = '';
            loadDetail(sid);
        }

        async function loadDetail(sid) {
            const detail = document.getElementById('chat-detail');
            detail.innerHTML = '<div class="empty">加载中...</div>';
            try {
                const res = await fetch(`${API_BASE}/history/${encodeURIComponent(sid)}`);
                const data = await res.json();
                document.getElementById('detail-title').textContent = sid.slice(0, 20) + (sid.length > 20 ? '...' : '');
                const items = data.items || [];
                document.getElementById('detail-meta').textContent = `共 ${items.length} 条消息`;
                if (!items.length) { detail.innerHTML = '<div class="empty">该会话暂无消息</div>'; return; }
                detail.innerHTML = items.map(m => `
                    <div class="msg ${m.role}">
                        <div>
                            <div class="bubble">${escapeHtml(m.text || '')}</div>
                            <div class="ts">${m.role === 'user' ? '👤 用户' : '🤖 掌柜智库'} · ${formatTs(m.ts)}</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                detail.innerHTML = `<div class="empty">❌ 加载失败：${e.message}</div>`;
            }
        }

        async function deleteCurrent() {
            if (!currentSessionId) return;
            if (!confirm('确定删除该会话吗？')) return;
            try {
                await fetch(`${API_BASE}/api/session/${encodeURIComponent(currentSessionId)}`, { method: 'DELETE' });
                currentSessionId = null;
                document.getElementById('chat-detail').innerHTML = '<div class="empty">会话已删除</div>';
                document.getElementById('detail-title').textContent = '选择会话查看对话记录';
                document.getElementById('delete-btn').style.display = 'none';
                loadSessions();
            } catch (e) { alert('删除失败：' + e.message); }
        }

        function escapeHtml(str) {
            return String(str || '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
        }
        function formatTs(ts) {
            if (!ts) return '-';
            const d = new Date(Number(ts) * 1000);
            const now = new Date();
            const diff = (now - d) / 1000;
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff/60) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff/3600) + ' 小时前';
            return d.toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
        }

        loadSessions();
    </script>
</body>
</html>
